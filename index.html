<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 7割理解ビューア＆クイズ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans JP', 'Plus Jakarta+Sans', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f5;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-sky-50 to-emerald-50 h-full text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 px-6 py-4 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-brain text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 tracking-tight">7割わかる！AI解説＆クイズ</h1>
                    <p class="text-xs text-slate-500">要約・例え・理解度クイズですっきりマスター</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openApiKeyModal()" class="text-xs text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-lg transition font-medium">
                    <i class="fa-solid fa-key mr-1"></i>APIキー設定
                </button>
                <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg transition">
                    <i class="fa-solid fa-trash-can mr-1"></i>履歴クリア
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col gap-6">

        <!-- Input Card -->
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl shadow-indigo-100/50 p-6 border border-slate-100 transition-all">
            <label for="themeInput" class="block text-sm font-semibold text-slate-700 mb-2">
                <i class="fa-solid fa-lightbulb text-amber-500 mr-2"></i>知りたいテーマ・言葉を入力してください
            </label>
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" id="themeInput" 
                        placeholder="例：量子コンピューター、ブロックチェーン、相対性理論、円高円安..." 
                        class="w-full px-4 py-3.5 pl-11 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-slate-800 placeholder-slate-400 transition"
                        onkeydown="if(event.key === 'Enter') generateContent()">
                    <span class="absolute left-4 top-4 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                </div>
                <button onclick="generateContent()" id="submitBtn" 
                    class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-medium px-6 py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition transform active:scale-95 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>7割理解する</span>
                </button>
            </div>

            <!-- Quick Tags -->
            <div class="mt-4 flex flex-wrap items-center gap-2">
                <span class="text-xs font-medium text-slate-400 mr-1">人気のテーマ:</span>
                <button onclick="setThemeAndSearch('量子コンピューター')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-3 py-1.5 rounded-lg transition">量子コンピューター</button>
                <button onclick="setThemeAndSearch('ブロックチェーン')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-3 py-1.5 rounded-lg transition">ブロックチェーン</button>
                <button onclick="setThemeAndSearch('エントロピー増大の法則')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-3 py-1.5 rounded-lg transition">エントロピー増大</button>
                <button onclick="setThemeAndSearch('インフレとデフレ')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-3 py-1.5 rounded-lg transition">インフレとデフレ</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg p-12 text-center border border-slate-100 flex flex-col items-center justify-center space-y-4">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 rounded-full border-4 border-indigo-200 animate-pulse"></div>
                <div class="absolute inset-0 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
            </div>
            <div>
                <h3 id="loadingText" class="font-bold text-slate-800 text-lg">わかりやすく噛み砕いています...</h3>
                <p class="text-xs text-slate-500 mt-1">要約と例え、クイズを生成中です</p>
            </div>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="hidden bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl shadow-indigo-100/50 p-6 md:p-8 border border-slate-100 transition-all space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex items-center space-x-2">
                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                        <i class="fa-solid fa-check mr-1"></i>7割理解モード
                    </span>
                    <span id="resultThemeTitle" class="text-slate-400 text-sm font-medium"></span>
                </div>
                <button onclick="copyResult()" class="text-slate-400 hover:text-indigo-600 text-sm transition bg-slate-50 hover:bg-indigo-50 px-3 py-1.5 rounded-lg flex items-center space-x-1">
                    <i class="fa-regular fa-copy"></i>
                    <span>コピー</span>
                </button>
            </div>

            <!-- Output Body -->
            <div id="textOutput" class="text-slate-700 leading-relaxed space-y-4 whitespace-pre-wrap">
                <!-- Content will be injected here -->
            </div>

            <!-- Quiz Launch / Section -->
            <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between bg-indigo-50/50 p-4 rounded-xl">
                <div>
                    <h4 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-circle-question text-indigo-600 mr-2"></i>理解度を確認しよう！</h4>
                    <p class="text-xs text-slate-500 mt-0.5">このテーマに関する3問のクイズにチャレンジできます。</p>
                </div>
                <button onclick="startQuiz()" class="mt-3 sm:mt-0 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl text-xs transition shadow-md shadow-indigo-200 flex items-center space-x-1.5">
                    <i class="fa-solid fa-play"></i>
                    <span>クイズを始める</span>
                </button>
            </div>
        </div>

        <!-- Quiz Container -->
        <div id="quizContainer" class="hidden bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl shadow-emerald-100/50 p-6 md:p-8 border border-emerald-100 transition-all space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex items-center space-x-2">
                    <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                        <i class="fa-solid fa-award mr-1"></i>理解度チェッククイズ
                    </span>
                    <span id="quizProgress" class="text-slate-400 text-xs font-medium"></span>
                </div>
                <button onclick="closeQuiz()" class="text-slate-400 hover:text-slate-600 text-xs"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="quizBody" class="space-y-4">
                <!-- Quiz questions injected here -->
            </div>
        </div>

        <!-- History Section -->
        <div id="historySection" class="hidden">
            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">閲覧履歴</h3>
            <div id="historyList" class="flex flex-wrap gap-2">
                <!-- History items -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400">
        <p>© 2026 AI 7割理解ビューア. Powered by Gemini API.</p>
    </footer>

    <!-- API Key Settings Modal -->
    <div id="apiKeyModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between">
                <h4 class="font-bold text-slate-800 text-lg flex items-center">
                    <i class="fa-solid fa-key text-indigo-600 mr-2"></i>Gemini APIキーの設定
                </h4>
                <button onclick="closeApiKeyModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">
                Google AI Studio等で取得したGemini APIキーを入力してください。ブラウザに安全に保存されます。
            </p>
            <div>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <div class="flex gap-2">
                <button onclick="saveApiKey()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition text-sm">
                    保存する
                </button>
                <button onclick="closeApiKeyModal()" class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition text-sm">
                    キャンセル
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Modal for Messages -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 text-center space-y-4">
            <div id="modalIcon" class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-info"></i>
            </div>
            <h4 id="modalTitle" class="font-bold text-slate-800 text-lg">お知らせ</h4>
            <p id="modalMessage" class="text-sm text-slate-600 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl transition">
                閉じる
            </button>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        let historyData = JSON.parse(localStorage.getItem('reading_history') || '[]');
        let currentQuizData = null;
        let currentQuestionIndex = 0;
        let userScore = 0;

        window.addEventListener('DOMContentLoaded', () => {
            renderHistory();
            const savedKey = localStorage.getItem('gemini_api_key');
            if (!savedKey) {
                setTimeout(openApiKeyModal, 500);
            }
        });

        function openApiKeyModal() {
            const savedKey = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('apiKeyInput').value = savedKey;
            document.getElementById('apiKeyModal').classList.remove('hidden');
            document.getElementById('apiKeyModal').classList.add('flex');
        }

        function closeApiKeyModal() {
            document.getElementById('apiKeyModal').classList.remove('flex');
            document.getElementById('apiKeyModal').classList.add('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                showModal("入力エラー", "APIキーを入力してください。", true);
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            closeApiKeyModal();
            showModal("保存完了", "APIキーを保存しました。テーマを入力してお楽しみください！");
        }

        function showModal(title, message, isError = false) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            const icon = document.getElementById('modalIcon');
            if (isError) {
                icon.className = "w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto text-xl";
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                icon.className = "w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto text-xl";
                icon.innerHTML = '<i class="fa-solid fa-info"></i>';
            }
            document.getElementById('customModal').classList.remove('hidden');
            document.getElementById('customModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('flex');
            document.getElementById('customModal').classList.add('hidden');
        }

        function setThemeAndSearch(theme) {
            document.getElementById('themeInput').value = theme;
            generateContent();
        }

        async function callGeminiAPIWithRetry(payload, retries = 3, delay = 1000) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                openApiKeyModal();
                throw new Error("APIキーが設定されていません。上の設定ボタンからAPIキーを入力してください。");
            }

            const models = ["gemini-3.7-flash", "gemini-3-flash-preview", "gemini-1.5-flash"];
            let lastError = null;

            for (const model of models) {
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        
                        const result = await response.json();
                        if (!response.ok) {
                            throw new Error(result.error?.message || `HTTP error! status: ${response.status}`);
                        }
                        
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!text) throw new Error("APIからの応答コンテンツが空でした。");
                        return text;
                    } catch (error) {
                        lastError = error;
                        console.warn(`Model ${model} attempt ${i + 1} failed:`, error);
                        if (error.message.includes("not found") || error.message.includes("not available")) break;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                    }
                }
            }
            throw lastError;
        }

        async function generateContent() {
            const theme = document.getElementById('themeInput').value.trim();
            if (!theme) {
                showModal("入力エラー", "テーマや言葉を入力してください。", true);
                return;
            }

            const loadingState = document.getElementById('loadingState');
            const resultContainer = document.getElementById('resultContainer');
            const quizContainer = document.getElementById('quizContainer');
            const submitBtn = document.getElementById('submitBtn');

            loadingState.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            quizContainer.classList.add('hidden');
            submitBtn.disabled = true;

            const systemPrompt = "あなたは優れた解説者および教育者です。ユーザーが入力したテーマについて、専門用語を控えめにし、誰もが約7割本質を理解できるわかりやすい読み物を作成してください。最初に簡潔な要約（3行程度）を記述し、その後に詳細な解説と日常に合わせた身近な例えを記述してください。";
            const userQuery = `テーマ: 「${theme}」について、最初に簡潔な要約を記載し、その後に例えをたくさん使ったわかりやすい詳細な解説を作成してください。`;

            try {
                const textOutput = await callGeminiAPIWithRetry({
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                });
                
                document.getElementById('resultThemeTitle').textContent = `テーマ: ${theme}`;
                document.getElementById('textOutput').textContent = textOutput;
                
                loadingState.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                
                addHistory(theme, textOutput);
                resultContainer.scrollIntoView({ behavior: 'smooth' });

                // Background generate quiz for this theme
                generateQuizData(theme);

            } catch (error) {
                loadingState.classList.add('hidden');
                console.error("Generation Error:", error);
                showModal("エラーが発生しました", error.message || "通信エラーが発生しました。", true);
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function generateQuizData(theme) {
            const quizPrompt = `テーマ「${theme}」に関する理解度確認用のクイズを3問作成してください。
必ず以下のJSONフォーマットのみ（Markdownのバッククォート等を含めない純粋なJSON文字列）で出力してください。

{
  "questions": [
    {
      "question": "問題文",
      "options": ["選択肢1", "選択肢2", "選択肢3", "選択肢4"],
      "answer": 0,
      "explanation": "解説文"
    }
  ]
}
※ answerは正解の選択肢のインデックス（0〜3）です。`;

            try {
                const resText = await callGeminiAPIWithRetry({
                    contents: [{ parts: [{ text: quizPrompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                });
                currentQuizData = JSON.parse(resText);
            } catch (e) {
                console.error("Quiz generation failed", e);
                currentQuizData = null;
            }
        }

        function startQuiz() {
            if (!currentQuizData || !currentQuizData.questions || currentQuizData.questions.length === 0) {
                showModal("準備中", "クイズを生成中です。数秒後にもう一度ボタンを押してください。");
                return;
            }
            currentQuestionIndex = 0;
            userScore = 0;
            document.getElementById('quizContainer').classList.remove('hidden');
            renderQuestion();
            document.getElementById('quizContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function closeQuiz() {
            document.getElementById('quizContainer').classList.add('hidden');
        }

        function renderQuestion() {
            const q = currentQuizData.questions[currentQuestionIndex];
            document.getElementById('quizProgress').textContent = `第 ${currentQuestionIndex + 1} 問 / 全 ${currentQuizData.questions.length} 問`;
            
            let html = `
                <h3 class="font-bold text-slate-800 text-base mb-4">${q.question}</h3>
                <div class="space-y-2.5">
            `;

            q.options.forEach((opt, idx) => {
                html += `
                    <button onclick="selectOption(${idx})" class="w-full text-left px-4 py-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl transition text-sm text-slate-700 font-medium flex items-center justify-between group">
                        <span><span class="inline-block w-6 h-6 rounded-full bg-slate-200 group-hover:bg-indigo-200 text-center text-xs leading-6 mr-2 font-bold">${['A','B','C','D'][idx]}</span>${opt}</span>
                    </button>
                `;
            });

            html += `</div>`;
            document.getElementById('quizBody').innerHTML = html;
        }

        function selectOption(selectedIdx) {
            const q = currentQuizData.questions[currentQuestionIndex];
            const isCorrect = (selectedIdx === q.answer);
            if (isCorrect) userScore++;

            let html = `
                <h3 class="font-bold text-slate-800 text-base mb-4">${q.question}</h3>
                <div class="space-y-2.5">
            `;

            q.options.forEach((opt, idx) => {
                let btnStyle = "bg-slate-50 border-slate-200 text-slate-700";
                if (idx === q.answer) {
                    btnStyle = "bg-emerald-50 border-emerald-400 text-emerald-800 font-bold";
                } else if (idx === selectedIdx && !isCorrect) {
                    btnStyle = "bg-rose-50 border-rose-400 text-rose-800";
                }
                html += `
                    <div class="w-full px-4 py-3 border rounded-xl text-sm ${btnStyle} flex items-center justify-between">
                        <span><span class="inline-block w-6 h-6 rounded-full text-center text-xs leading-6 mr-2 font-bold">${['A','B','C','D'][idx]}</span>${opt}</span>
                        ${idx === q.answer ? '<i class="fa-solid fa-check text-emerald-600"></i>' : (idx === selectedIdx ? '<i class="fa-solid fa-xmark text-rose-600"></i>' : '')}
                    </div>
                `;
            });

            html += `
                </div>
                <div class="mt-4 p-4 rounded-xl ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'} text-xs leading-relaxed">
                    <p class="font-bold mb-1"><i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'} mr-1.5"></i>${isCorrect ? '正解です！' : '不正解...'}</p>
                    <p>${q.explanation}</p>
                </div>
                <button onclick="nextQuestion()" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-sm transition shadow-md">
                    ${currentQuestionIndex < currentQuizData.questions.length - 1 ? '次の問題へ' : '結果を見る'}
                </button>
            `;

            document.getElementById('quizBody').innerHTML = html;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizData.questions.length) {
                renderQuestion();
            } else {
                showQuizResult();
            }
        }

        function showQuizResult() {
            const total = currentQuizData.questions.length;
            const percentage = Math.round((userScore / total) * 100);
            let message = "素晴らしい理解度です！完璧にマスターできましたね！";
            if (percentage < 70) message = "あともう一息！解説をもう一度見直してみましょう。";

            let html = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto text-2xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <h3 class="font-bold text-slate-800 text-xl">クイズ終了！</h3>
                    <p class="text-sm text-slate-600">正解数: <span class="font-bold text-indigo-600 text-lg">${userScore}</span> / ${total} 問正解 (${percentage}%)</p>
                    <p class="text-xs text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-100">${message}</p>
                    <button onclick="closeQuiz()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl text-sm transition">
                        閉じる
                    </button>
                </div>
            `;
            document.getElementById('quizBody').innerHTML = html;
        }

        function addHistory(theme, content) {
            historyData = historyData.filter(item => item.theme !== theme);
            historyData.unshift({ theme, content, date: new Date().toLocaleDateString() });
            if (historyData.length > 10) historyData.pop();
            localStorage.setItem('reading_history', JSON.stringify(historyData));
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const historySection = document.getElementById('historySection');
            
            if (historyData.length === 0) {
                historySection.classList.add('hidden');
                return;
            }

            historySection.classList.remove('hidden');
            historyList.innerHTML = historyData.map((item, index) => `
                <button onclick="loadHistoryItem(${index})" class="text-xs bg-white border border-slate-200 hover:border-indigo-300 hover:text-indigo-600 text-slate-700 px-3 py-1.5 rounded-lg shadow-sm transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-slate-400"></i>
                    <span>${item.theme}</span>
                </button>
            `).join('');
        }

        function loadHistoryItem(index) {
            const item = historyData[index];
            if (!item) return;
            document.getElementById('themeInput').value = item.theme;
            document.getElementById('resultThemeTitle').textContent = `テーマ: ${item.theme}`;
            document.getElementById('textOutput').textContent = item.content;
            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('resultContainer').scrollIntoView({ behavior: 'smooth' });
            generateQuizData(item.theme);
        }

        function clearHistory() {
            historyData = [];
            localStorage.removeItem('reading_history');
            renderHistory();
            showModal("履歴クリア", "閲覧履歴をすべて削除しました。");
        }

        function copyResult() {
            const outputText = document.getElementById('textOutput').innerText;
            const textArea = document.createElement("textarea");
            textArea.value = outputText;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showModal("コピー完了", "読み物の内容をクリップボードにコピーしました。");
            } catch (err) {
                showModal("エラー", "コピーに失敗しました。", true);
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
